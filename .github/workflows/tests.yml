name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: strict

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        conda install -c conda-forge gdal itk itk-elastix numpy scipy matplotlib pyyaml pillow reportlab
        pip install pytest pytest-cov

    - name: Install GeoElastix
      shell: bash -l {0}
      run: |
        pip install -e .

    - name: Verify installation
      shell: bash -l {0}
      run: |
        geoelastix --version
        geoelastix list-methods

    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest tests/ -v --cov=geoelastix --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false