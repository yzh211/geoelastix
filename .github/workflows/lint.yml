name: Linting

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 geoelastix --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 geoelastix --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check geoelastix

    - name: Check import sorting with isort
      run: |
        isort --check-only geoelastix

    - name: Type check with mypy
      run: |
        mypy geoelastix --ignore-missing-imports || true