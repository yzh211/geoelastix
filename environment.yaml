name: geoelastix
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python>=3.8

  # Geospatial libraries (GDAL must be from conda for Windows compatibility)
  - gdal
  - rasterio
  - pyproj>=3.3

  # Scientific computing
  - numpy>=1.20
  - scipy>=1.7

  # # Image processing and registration
  # - itk>=5.2
  
  # Visualization
  - matplotlib>=3.5

  # Configuration and I/O
  - pyyaml

  # PDF generation
  - reportlab>=3.6
  - pillow>=9.0

  # Testing
  - pytest>=7.0
  - pytest-cov>=3.0

  # Development tools
  - pip

  # Pip dependencies (if needed)
  - pip:
    - itk
    - itk-io
    - itk-elastix
    - -e .
